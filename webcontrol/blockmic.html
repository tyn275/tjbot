<div class="card p-4 shadow-sm border-0 bg-white h-100">
    <div class="d-flex align-items-center mb-3">
        <div class="p-2 rounded me-3" style="background-color: #fff4e6; color: #fd7e14;">
            <i class="fa-solid fa-microphone fa-2x"></i>
        </div>
        <div>
            <h5 class="fw-bold text-dark mb-0">HỆ THỐNG THU ÂM (MICROPHONE)</h5>
            <small class="text-muted">Thu nhận tín hiệu âm thanh trực tiếp từ môi trường xung quanh</small>
        </div>
    </div>

    <div class="row align-items-center mb-3" style="table-layout: fixed; width: 100%; margin: 0;">
        <div class="col-auto text-center border-end pe-4 me-2">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border" style="min-width: 150px; min-height: 145px;">
                <div class="mic-disk-ui" id="diskRecord">
                    <i class="fa-solid fa-microphone-lines" id="iconRecordMic"></i>
                </div>
                <div class="mt-2 fw-bold text-warning" style="font-size: 0.85rem;">Nói nhại</div>
            </div>
        </div>

        <div class="col" style="min-width: 0; overflow: hidden;">
            <div class="mb-2">
                <h6 class="fw-bold text-dark mb-0" style="font-size: 0.9rem;">1. NGHE VÀ NÓI NHẠI</h6>
                <small class="text-danger fw-semibold" style="font-size: 0.72rem;">👉 Vui lòng nói thật gần sát Microphone của TJBot</small>
            </div>
            <div class="row g-2 align-items-center bg-light p-2 rounded border">
                <div class="col-4">
                    <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Thời gian nghe (s):</label>
                    <input type="number" id="numRecordTimeout" class="form-control form-control-sm text-center" value="5" min="2" max="20" style="font-size: 0.8rem;">
                </div>
                <div class="col-4">
                    <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Hành động:</label>
                    <button class="btn btn-warning btn-sm fw-bold w-100 text-white" style="font-size: 0.8rem;" onclick="triggerRecord(true)">
                        <i class="fa-solid fa-ear-listen me-1"></i> Nghe
                    </button>
                </div>
                <div class="col-4">
                    <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Ngắt:</label>
                    <button class="btn btn-secondary btn-sm fw-bold w-100" style="font-size: 0.8rem;" onclick="triggerRecord(false)">
                        <i class="fa-solid fa-stop me-1"></i> Dừng
                    </button>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-3 text-muted opacity-50" style="border-top: 1px dashed #ccc;">

    <div class="row align-items-center" style="table-layout: fixed; width: 100%; margin: 0;">
        <div class="col-auto text-center border-end pe-4 me-2">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border" style="min-width: 150px; min-height: 255px;">
                <div class="mic-disk-ui" id="diskListen">
                    <i class="fa-solid fa-brain" id="iconListenMic"></i>
                </div>
                <div class="mt-2 fw-bold text-info" style="font-size: 0.85rem;">Nghe hiểu</div>
            </div>
        </div>

        <div class="col" style="min-width: 0; overflow: hidden;">
            <div class="mb-2">
                <h6 class="fw-bold text-dark mb-0" style="font-size: 0.9rem;">2. NGHE HIỂU (AI RECOGNITION)</h6>
                <small class="text-muted" style="font-size: 0.72rem;">Hệ thống nhận diện giọng nói và chuyển đổi thành văn bản</small>
            </div>
            
            <div class="bg-light p-2 rounded border d-flex flex-column gap-2">
                <div>
                    <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">KẾT QUẢ NHẬN DIỆN VĂN BẢN (SPEECH TO TEXT):</label>
                    <textarea id="txtS2tOutput" class="form-control form-control-sm bg-white fw-semibold text-dark" rows="3" style="font-size: 0.82rem; border-color: #a5d8ff;" readonly placeholder="Đang đợi Robot lắng nghe và dịch giọng nói..."></textarea>
                </div>

                <div class="row g-2 align-items-center">
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Thời gian nghe (s):</label>
                        <input type="number" id="numListenTimeout" class="form-control form-control-sm text-center" value="5" min="2" max="20" style="font-size: 0.8rem;">
                    </div>
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Hành động:</label>
                        <button class="btn btn-info btn-sm fw-bold w-100 text-white" style="font-size: 0.8rem;" onclick="triggerListen(true)">
                            <i class="fa-solid fa-bolt me-1"></i> Nghe
                        </button>
                    </div>
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block mb-1" style="font-size:0.65rem;">Ngắt:</label>
                        <button class="btn btn-secondary btn-sm fw-bold w-100" style="font-size: 0.8rem;" onclick="triggerListen(false)">
                            <i class="fa-solid fa-stop me-1"></i> Dừng
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-muted mt-2 small d-block text-truncate" style="max-width: 100%; font-size: 0.65rem;">
                Chuỗi lệnh MQTT: <span id="lblMicCommandLog" class="text-warning fw-bold">Đang đợi...</span>
            </div>
        </div>
    </div>
</div>

<style>
    .mic-disk-ui {
        width: 110px;
        height: 110px;
        background: #fafafa;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
        transition: all 0.3s ease;
    }

    #iconRecordMic { font-size: 2.6rem; color: #fd7e14; }
    #iconListenMic { font-size: 2.6rem; color: #15aabf; }

    .listening-pulse-orange { 
        animation: audioPulseOrange 1.2s infinite ease-in-out; 
        color: #e67e22 !important; 
    }
    @keyframes audioPulseOrange {
        0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(253, 126, 20, 0.2)); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 12px rgba(253, 126, 20, 0.6)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(253, 126, 20, 0.2)); }
    }

    .listening-pulse-blue { 
        animation: audioPulseBlue 1.2s infinite ease-in-out; 
        color: #0b7285 !important; 
    }
    @keyframes audioPulseBlue {
        0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(21, 170, 191, 0.2)); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 12px rgba(21, 170, 191, 0.6)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(21, 170, 191, 0.2)); }
    }

    #diskRecord:has(.listening-pulse-orange) { background: #fff9db !important; border-color: #ffe066 !important; }
    #diskListen:has(.listening-pulse-blue) { background: #e3faf2 !important; border-color: #96f2d7 !important; }
</style>

<script>
    function checkMqttConnection() {
        if (typeof mqttClient !== "undefined" && mqttClient && typeof mqttClient.isConnected === "function") {
            return mqttClient.isConnected();
        }
        return false;
    }

    window.triggerRecord = function(status) {
        if (!checkMqttConnection()) {
            alert("⚠️ Lỗi: Chưa kết nối MQTT Server! Không thể thực hiện lệnh điều khiển Mic.");
            return;
        }

        const icon = document.getElementById('iconRecordMic');
        const log = document.getElementById('lblMicCommandLog');
        let cmd = "";

        if (status) {
            const timeout = document.getElementById('numRecordTimeout').value || 5;
            cmd = `Record(on, ${timeout})`;
            log.innerHTML = `Lệnh: <span class="text-warning">${cmd}</span>`;
            window.stopAllMicAnimations();
            if(icon) icon.classList.add('listening-pulse-orange');
        } else {
            cmd = "Record(off)";
            log.innerHTML = `Lệnh: <span class="text-secondary">${cmd}</span>`;
            window.stopAllMicAnimations();
        }

        if (typeof sendMQTTCommand === "function") sendMQTTCommand(cmd);
    };

    window.triggerListen = function(status) {
        if (!checkMqttConnection()) {
            alert("⚠️ Lỗi: Chưa kết nối MQTT Server! Không thể thực hiện lệnh điều khiển Mic.");
            return;
        }

        const icon = document.getElementById('iconListenMic');
        const log = document.getElementById('lblMicCommandLog');
        let cmd = "";

        if (status) {
            // Xóa rỗng nội dung text cũ để chuẩn bị đón nhận kết quả mới dịch được
            const outTxt = document.getElementById('txtS2tOutput');
            if(outTxt) outTxt.value = "";

            const timeout = document.getElementById('numListenTimeout').value || 5;
            cmd = `Listen(on, ${timeout})`;
            log.innerHTML = `Lệnh: <span class="text-info">${cmd}</span>`;
            window.stopAllMicAnimations();
            if(icon) icon.classList.add('listening-pulse-blue');
        } else {
            cmd = "Listen(off)";
            log.innerHTML = `Lệnh: <span class="text-secondary">${cmd}</span>`;
            window.stopAllMicAnimations();
        }

        if (typeof sendMQTTCommand === "function") sendMQTTCommand(cmd);
    };

    window.stopAllMicAnimations = function() {
        const i1 = document.getElementById('iconRecordMic');
        const i2 = document.getElementById('iconListenMic');
        if(i1) i1.classList.remove('listening-pulse-orange');
        if(i2) i2.classList.remove('listening-pulse-blue');
    };

    // 🆕 THÊM MỚI: Hàm toàn cục xử lý bóc tách chuỗi s2t từ MQTT trả về
    window.handleMqttSpeechToText = function(payload) {
        // Kiểm tra xem dữ liệu có chứa chuỗi định dạng mong muốn không (Ví dụ: "s2t=Xin chào robot")
        if (payload.includes("s2t=")) {
            // Tách chuỗi lấy nội dung đứng sau chữ "s2t="
            const textResult = payload.split("s2t=")[1];
            const outTxt = document.getElementById('txtS2tOutput');
            if (outTxt) {
                outTxt.value = textResult; // Đẩy nội dung dịch được vào textarea
                
                // Khi nhận được văn bản trả về nghĩa là quá trình dịch hoàn tất -> Tắt luôn hoạt họa nhấp nháy
                window.stopAllMicAnimations();
            }
        }
    };
</script>
