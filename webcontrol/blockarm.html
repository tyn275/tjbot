<style>
    /* Đĩa nền mô phỏng y hệt các thuộc tính CSS của armCanvas */
    .wave-icon-disk {
        width: 120px;
        height: 120px;
        background: #fafafa; /* Trùng màu nền đĩa Canvas */
        border-radius: 50%;   /* Bo tròn 100% giống đĩa Canvas */
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.02); /* Độ sâu nhẹ */
    }

    /* Biểu tượng bàn tay nằm ở tâm đĩa */
    .wave-icon-disk i {
        font-size: 3rem;
        color: #f59f00; /* Màu vàng cam chủ đạo của Robot Arm */
        transform-origin: bottom center; /* Neo cố định cổ tay để lắc */
        animation: cssWaveHand 1.4s ease-in-out infinite;
    }

    @keyframes cssWaveHand {
        0%   { transform: rotate(0deg); }
        20%  { transform: rotate(-12deg); }
        40%  { transform: rotate(10deg); }
        60%  { transform: rotate(-10deg); }
        80%  { transform: rotate(8deg); }
        100% { transform: rotate(0deg); }
    }

    /* Tùy chỉnh màu sắc riêng cho nút Trạng thái Cơ bắp */
    .btn-check:checked + .btn-outline-danger {
        background-color: #dc3545;
        color: #fff;
    }

    /* Responsive tinh chỉnh layout mượt mà chống tràn viền trên mobile */
    @media (max-width: 575.98px) {
        .border-end {
            border-right: none !important;
            border-bottom: 1px dashed #eee !important;
            padding-right: 0 !important;
            padding-bottom: 1rem !important;
            margin-right: 0 !important;
            margin-bottom: 0.5rem !important;
        }
    }
</style>

<div class="card p-4 shadow-sm border-0 bg-white h-100">
    <div class="d-flex align-items-center mb-3 flex-wrap gap-3">
        <div class="d-flex align-items-center">
            <div class="p-2 rounded me-3" style="background-color: #fff9db; color: #f59f00;">
                <i class="fa-solid fa-robot fa-2x"></i>
            </div>
            <div>
                <h5 class="fw-bold text-dark mb-0">CÁNH TAY ROBOT (ARM CONTROLLER)</h5>
                <small class="text-muted">Cấu hình góc quay vật lý và kịch bản cử động</small>
            </div>
        </div>
        
        <div class="ms-auto d-flex align-items-center gap-2">
            <span class="small fw-bold text-secondary"><i class="fa-solid fa-dumbbell"></i> Trạng thái:</span>
            <div class="btn-group border rounded p-1 bg-light" role="group" aria-label="Arm Muscle Control">
                <input type="radio" class="btn-check" name="muscleState" id="radMuscleOn" autocomplete="off" checked onchange="toggleMuscle('on')">
                <label class="btn btn-sm btn-outline-success fw-bold px-3 border-0 rounded" for="radMuscleOn">Cơ bắp</label>

                <input type="radio" class="btn-check" name="muscleState" id="radMuscleOff" autocomplete="off" onchange="toggleMuscle('off')">
                <label class="btn btn-sm btn-outline-danger fw-bold px-3 border-0 rounded" for="radMuscleOff">Nghỉ ngơi</label>
            </div>
        </div>
    </div>
    
    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
        <div class="text-center border-end pe-4 me-2 mx-auto mx-sm-0" style="min-width: 150px;">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border" style="height: 160px;">
                <canvas id="armCanvas" width="120" height="120" style="cursor: pointer; background: #fafafa; border-radius: 50%;"></canvas>
                <div class="mt-2 fw-bold text-warning" id="lblAngleDisplay" style="font-size: 0.9rem;">Góc: 0°</div>
            </div>
        </div>

        <div class="flex-grow-1" style="flex-basis: 200px; min-width: 0;">
            <div class="mb-2">
                <label class="form-label fw-semibold text-secondary small mb-1">1. ĐIỀU KHIỂN GÓC QUAY SERVO</label>
            </div>

            <div class="d-flex flex-column gap-3 bg-light p-3 rounded border">
                <div class="form-check form-switch p-0 d-flex align-items-center gap-2">
                    <input class="form-check-input ms-0" type="checkbox" id="chkFollowMe" style="cursor: pointer; width: 2.5em; height: 1.25em;">
                    <label class="form-check-label small fw-bold text-dark" for="chkFollowMe" style="cursor: pointer;">
                        <i class="fa-solid fa-bolt text-warning me-1"></i> Làm theo tôi (Real-time MQTT)
                    </label>
                </div>

                <button class="btn btn-primary fw-bold w-100 btn-sm" id="btnExecuteArm" onclick="sendSingleArmAngle()">
                    <i class="fa-solid fa-circle-check me-1"></i> Thực hiện
                </button>
            </div>
            
            <div class="text-muted small mt-2" style="font-size: 0.7rem;">
                * Hướng dẫn: Click/Kéo chuột trên đĩa trái để đổi góc ($-90^\circ$ hướng thẳng lên trên, $90^\circ$ hướng thẳng xuống dưới).
            </div>
        </div>
    </div>

    <hr class="my-4 text-muted opacity-50" style="border-top: 2px dashed #ccc;">

    <div class="d-flex flex-wrap gap-3 align-items-center">
        <div class="text-center border-end pe-4 me-2 mx-auto mx-sm-0" style="min-width: 150px;">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border" style="height: 160px;">
                <div class="wave-icon-disk">
                    <i class="fa-solid fa-hand"></i>
                </div>
                <div class="mt-2 fw-bold text-muted" style="font-size: 0.9rem;">Kịch bản vẫy</div>
            </div>
        </div>
        
        <div class="flex-grow-1" style="flex-basis: 200px; min-width: 0;">
            <div class="mb-2">
                <label class="form-label fw-semibold text-secondary small mb-1">2. VẪY TAY</label>
            </div>

            <div class="bg-light p-2 rounded border">
                <div class="row row-cols-1 row-cols-sm-4 g-2 align-items-end">
                    <div class="col">
                        <span class="text-muted small fw-bold d-block mb-1" style="font-size: 0.65rem;">Lần:</span>
                        <input type="number" id="waveTimes" class="form-control form-control-sm text-center" value="1" min="1" max="20" style="font-size: 0.8rem;">
                    </div>

                    <div class="col">
                        <span class="text-muted small fw-bold d-block mb-1" style="font-size: 0.65rem;">Tốc độ:</span>
                        <select id="waveSpeed" class="form-select form-select-sm" style="font-size: 0.8rem; cursor: pointer;">
                            <option value="fast" selected>Fast</option>
                            <option value="low">Low</option>
                        </select>
                    </div>

                    <div class="col">
                        <button class="btn btn-warning btn-sm fw-bold w-100 text-white" style="font-size: 0.8rem; white-space: normal;" onclick="triggerWaveHand()">
                            Vẫy tay
                        </button>
                    </div>

                    <div class="col">
                        <button class="btn btn-danger btn-sm fw-bold w-100" style="font-size: 0.8rem; white-space: normal;" onclick="stopWaveHand()">
                            <i class="fa-solid fa-hand-slash me-1"></i> Dừng
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="text-muted mt-2" style="font-size: 0.72rem;">Lệnh xuất: <span id="lblArmCommandLog" class="text-primary fw-bold">Wavehand(fast, 1)</span></div>
        </div>
    </div>
</div>

<script>
    console.log("🦾 Khối Cánh Tay Robot bán nguyệt đã được sửa lỗi hiển thị chập chờn và tích hợp nút Muscle!");

    const canvas = document.getElementById('armCanvas');
    const ctx = canvas.getContext('2d');
    const lblDisplay = document.getElementById('lblAngleDisplay');
    const chkFollowMe = document.getElementById('chkFollowMe');
    const btnExecute = document.getElementById('btnExecuteArm');

    let currentAngle = 0; // Góc mặc định (0 độ - phương ngang bên phải)
    let isDragging = false;

    function toggleMuscle(state) {
        if (state === 'on') {
            sendMQTTCommand("Muscle(on)");
            btnExecute.disabled = chkFollowMe.checked;
        } else if (state === 'off') {
            sendMQTTCommand("Muscle(off)");
        }
    }

    function drawArm(angleDegrees) {
        if (!ctx || !canvas || canvas.width === 0 || canvas.height === 0) return;

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(cx, cy, 45, Math.PI * 1.5, Math.PI * 0.5, false);
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]); 

        ctx.beginPath();
        ctx.moveTo(cx, cy - 45);
        ctx.lineTo(cx, cy + 45);
        ctx.strokeStyle = '#f0f0f0';
        ctx.stroke();

        const angleRadians = angleDegrees * (Math.PI / 180);

        ctx.save();
        ctx.translate(cx, cy);      
        ctx.rotate(angleRadians);   

        ctx.beginPath();
        ctx.arc(0, 0, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#333';
        ctx.fill();

        const w = 45;  
        const h = 12;  
        const r = 3;   
        const x = 0;
        const y = -6;  

        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();

        ctx.fillStyle = '#f59f00'; 
        ctx.strokeStyle = '#d97706';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }

    function calculateAngleFromMouse(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const radians = Math.atan2(mouseY - cy, mouseX - cx);
        let degrees = Math.round(radians * (180 / Math.PI));

        if (degrees > 90) degrees = 90;
        if (degrees < -90) degrees = -90;

        return degrees;
    }

    function handleAngleChange(newAngle) {
        currentAngle = newAngle;
        lblDisplay.innerText = `Góc: ${currentAngle}°`;
        drawArm(currentAngle);

        if (chkFollowMe.checked) {
            document.getElementById('radMuscleOn').checked = true;
            sendMQTTCommand(`Arm(${currentAngle})`);
        }
    }

    canvas.addEventListener('mousedown', function(e) {
        isDragging = true;
        handleAngleChange(calculateAngleFromMouse(e));
    });

    window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        handleAngleChange(calculateMouseAngleWithLimit(e));
    });

    function calculateMouseAngleWithLimit(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const radians = Math.atan2(mouseY - cy, mouseX - cx);
        let degrees = Math.round(radians * (180 / Math.PI));

        if (degrees > 90 && degrees <= 180) degrees = 90;
        if (degrees < -90 && degrees >= -180) degrees = -90;

        return degrees;
    }

    window.addEventListener('mouseup', function() {
        isDragging = false;
    });

    chkFollowMe.addEventListener('change', function() {
        if (this.checked) {
            btnExecute.disabled = true; 
            document.getElementById('radMuscleOn').checked = true;
            sendMQTTCommand(`Arm(${currentAngle})`);
        } else {
            btnExecute.disabled = false; 
        }
    });

    function sendSingleArmAngle() {
        document.getElementById('radMuscleOn').checked = true;
        sendMQTTCommand(`Arm(${currentAngle})`);
    }

    function triggerWaveHand() {
        const times = document.getElementById('waveTimes').value || 1;
        const speed = document.getElementById('waveSpeed').value;
        
        document.getElementById('radMuscleOn').checked = true;
        const command = `Wavehand(${speed}, ${times})`;
        document.getElementById('lblArmCommandLog').innerText = `Lệnh xuất: ${command}`;
        
        sendMQTTCommand(command);
    }

    /* 💡 BỔ SUNG MỚI: Hàm xử lý kích hoạt lệnh dừng vẫy tay */
    function stopWaveHand() {
        const command = `Wavehand(off)`;
        document.getElementById('lblArmCommandLog').innerText = `Lệnh xuất: ${command}`;
        
        // Gửi lệnh thô, hàm sendMQTTCommand tối ưu của bạn sẽ tự động chuyển thành Wavehand("off") trước khi gửi lên mạng
        sendMQTTCommand(command);
    }

    drawArm(currentAngle);
    setTimeout(() => { drawArm(currentAngle); }, 50);
    setTimeout(() => { drawArm(currentAngle); }, 300);

    if (window.ResizeObserver) {
        const resizeObserver = new ResizeObserver(() => {
            drawArm(currentAngle);
        });
        resizeObserver.observe(canvas);
    }
</script>
