<div class="card p-4 shadow-sm border-0 bg-white h-100">
    <div class="d-flex align-items-center mb-3">
        <div class="p-2 rounded me-3" style="background-color: #e3faf2; color: #e64980;">
            <i class="fa-solid fa-volume-high fa-2x"></i>
        </div>
        <div>
            <h5 class="fw-bold text-dark mb-0">HỆ THỐNG ÂM THANH (AUDIO)</h5>
            <small class="text-muted">Phát âm thanh ra loa</small>
        </div>
    </div>

    <div class="row align-items-center mb-3" style="table-layout: fixed; width: 100%; margin: 0;">
        <div class="col-auto text-center border-end pe-4 me-2">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border"
                style="min-width: 150px; min-height: 145px;">
                <div class="audio-disk-ui" id="diskBibo">
                    <i class="fa-solid fa-face-kiss-beam" id="iconLips"></i>
                </div>
                <div class="mt-2 fw-bold" style="font-size: 0.85rem; color: #e64980;">Bi bô</div>
            </div>
        </div>

        <div class="col" style="min-width: 0; overflow: hidden;">
            <div class="mb-2">
                <label class="form-label fw-semibold text-secondary small mb-1" style="font-size: 0.75rem;">1. PHÁT FILE
                    CÓ SẴN</label>
            </div>
            <div class="row g-2 align-items-center bg-light p-2 rounded border">
                <div class="col-12">
                    <select id="selAudioFile" class="form-select form-select-sm" style="font-size: 0.8rem;">
                        <option value="hello.mp3" selected>hello.mp3 (Chào hỏi)</option>
                        <option value="bye.mp3">bye.mp3 (Tạm biệt)</option>
                        <option value="happy.mp3">happy.mp3 (Vui vẻ)</option>
                        <option value="alarm.mp3">alarm.mp3 (Cảnh báo)</option>
                    </select>
                </div>
                <div class="col-6">
                    <button class="btn btn-sm fw-bold w-100"
                        style="font-size: 0.8rem; background-color: #e64980; color: white;" onclick="triggerPlayFile()">
                        <i class="fa-solid fa-play me-1"></i> Nói
                    </button>
                </div>
                <div class="col-6">
                    <button class="btn btn-secondary btn-sm fw-bold w-100" style="font-size: 0.8rem;"
                        onclick="triggerSilentAudio()">
                        <i class="fa-solid fa-comment-slash me-1"></i> Suỵt
                    </button>
                </div>
            </div>
        </div>
    </div>

    <hr class="my-3 text-muted opacity-50" style="border-top: 1px dashed #ccc;">

    <div class="row align-items-center" style="table-layout: fixed; width: 100%; margin: 0;">
        <div class="col-auto text-center border-end pe-4 me-2">
            <div class="p-2 bg-white rounded d-flex flex-column align-items-center justify-content-center border"
                style="min-width: 150px; min-height: 240px;">
                <div class="audio-disk-ui" id="diskTapDoc">
                    <i class="fa-solid fa-book-open-reader" id="iconBook"></i>
                </div>
                <div class="mt-2 fw-bold text-primary" style="font-size: 0.85rem;">Tập đọc</div>
            </div>
        </div>

        <div class="col" style="min-width: 0; overflow: hidden;">
            <div class="mb-1">
                <label class="form-label fw-semibold text-secondary small mb-0" style="font-size: 0.75rem;">2. CHUYỂN
                    ĐỔI VĂN BẢN (TTS)</label>
            </div>
            <div class="bg-light p-2 rounded border d-flex flex-column gap-2">
                <div>
                    <textarea id="txtTtsInput" class="form-control form-control-sm" rows="3" style="font-size: 0.8rem;"
                        placeholder="Nhập văn bản..." oninput="validateWordLimit(this)"></textarea>
                    <div class="d-flex justify-content-between mt-1 px-1" style="font-size: 0.65rem;">
                        <span class="text-danger fw-bold" id="lblTtsAlert"></span>
                        <span class="text-muted" id="lblWordCount">0 / 120 từ</span>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block" style="font-size:0.65rem;">Mã quốc gia:</label>
                        <select id="selLang" class="form-select form-select-sm" style="font-size: 0.75rem;"
                            onchange="updateVoiceDropdown()">
                            <option value="vi" selected>Tiếng Việt</option>
                            <option value="en">English</option>
                            <option value="ja">Japanese</option>
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block" style="font-size:0.65rem;">Giọng đọc:</label>
                        <select id="selVoice" class="form-select form-select-sm" style="font-size: 0.75rem;">
                        </select>
                    </div>
                    <div class="col-4">
                        <label class="text-muted small fw-bold d-block" style="font-size:0.65rem;">Dịch vụ:</label>
                        <select id="selService" class="form-select form-select-sm" style="font-size: 0.75rem;">
                            <option value="Google" selected>Google</option>
                            <option value="FPT">FPT AI</option>
                            <option value="Viettel">Viettel AI</option>
                        </select>
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <button class="btn btn-primary btn-sm fw-bold w-100" style="font-size: 0.8rem;"
                            onclick="triggerTTS()">
                            <i class="fa-solid fa-volume-high me-1"></i> Đọc
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-secondary btn-sm fw-bold w-100" style="font-size: 0.8rem;"
                            onclick="triggerSilentAudio()">
                            <i class="fa-solid fa-comment-slash me-1"></i> Suỵt
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-muted mt-2 small d-block text-truncate" style="max-width: 100%; font-size: 0.65rem;">
                Chuỗi lệnh MQTT: <span id="lblAudioCommandLog" class="text-primary fw-bold">Đang đợi...</span>
            </div>
        </div>
    </div>
</div>

<style>
    .audio-disk-ui {
        width: 110px;
        height: 110px;
        background: #fafafa;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.02);
        transition: all 0.3s ease;
    }

    #iconLips {
        font-size: 2.8rem;
        color: #e64980;
    }

    #iconBook {
        font-size: 2.6rem;
        color: #1c7ed6;
    }

    .talking-animation {
        animation: lipsChattering 0.25s ease-in-out infinite;
        color: #e64980 !important;
    }

    @keyframes lipsChattering {
        0% {
            transform: scaleY(1) scaleX(1);
        }

        50% {
            transform: scaleY(0.5) scaleX(1.05);
        }

        100% {
            transform: scaleY(1) scaleX(1);
        }
    }

    .reading-animation {
        animation: bookReading 0.6s ease-in-out infinite alternate;
        color: #3b5bdb !important;
    }

    @keyframes bookReading {
        0% {
            transform: rotate(-5deg) scale(1);
        }

        100% {
            transform: rotate(5deg) scale(1.05);
            filter: drop-shadow(0 0 5px rgba(28, 126, 214, 0.5));
        }
    }
</style>

<script>
    if (typeof MAX_WORD_LIMIT === 'undefined') { var MAX_WORD_LIMIT = 120; }
    if (typeof VOICE_DATA === 'undefined') {
        var VOICE_DATA = {
            vi: [
                { text: "Ban Mai (Nữ Bắc)", value: "vi-VN-Standard-A" },
                { text: "Lê Minh (Nam Bắc)", value: "vi-VN-Standard-B" },
                { text: "Thu Minh (Nữ Nam)", value: "vi-VN-Standard-C" }
            ],
            en: [
                { text: "John (Nam US)", value: "en-US-Standard-A" },
                { text: "Mary (Nữ US)", value: "en-US-Standard-B" }
            ],
            ja: [
                { text: "Sakura (Nữ Nhật)", value: "ja-JP-Standard-A" }
            ]
        };
    }

    // Hàm tiện ích nội bộ để kiểm tra trạng thái kết nối MQTT của trang mẹ
    function checkMqttConnection() {
        if (typeof mqttClient !== "undefined" && mqttClient && typeof mqttClient.isConnected === "function") {
            return mqttClient.isConnected();
        }
        return false;
    }

    window.updateVoiceDropdown = function () {
        const langEl = document.getElementById('selLang');
        const voiceSelect = document.getElementById('selVoice');
        if (!langEl || !voiceSelect) return;

        voiceSelect.innerHTML = "";
        (VOICE_DATA[langEl.value] || []).forEach(v => {
            const opt = document.createElement('option');
            opt.value = v.value; opt.text = v.text;
            voiceSelect.appendChild(opt);
        });
    };

    window.validateWordLimit = function (textarea) {
        const words = textarea.value.trim() === "" ? [] : textarea.value.trim().split(/\s+/);
        const lblCount = document.getElementById('lblWordCount');
        const lblAlert = document.getElementById('lblTtsAlert');
        if (lblCount) lblCount.innerText = `${words.length} / ${MAX_WORD_LIMIT} từ`;

        if (words.length > MAX_WORD_LIMIT) {
            if (lblAlert) lblAlert.innerText = `⚠️ Quá ${MAX_WORD_LIMIT} từ!`;
            textarea.value = words.slice(0, MAX_WORD_LIMIT).join(" ");
            if (lblCount) lblCount.innerText = `${MAX_WORD_LIMIT} / ${MAX_WORD_LIMIT} từ`;
        } else { if (lblAlert) lblAlert.innerText = ""; }
    };

    window.triggerPlayFile = function () {
        // 🔒 CHẶN HOẠT HỌA NẾU MẤT KẾT NỐI
        if (!checkMqttConnection()) {
            alert("⚠️ Lỗi: Chưa kết nối MQTT Server! Không thể thực hiện lệnh phát âm thanh.");
            return;
        }

        const file = document.getElementById('selAudioFile').value;
        const cmd = `Play("${file}")`;
        document.getElementById('lblAudioCommandLog').innerHTML = `Lệnh: <span class="text-success">${cmd}</span>`;
        window.stopAllAudioAnimations();
        document.getElementById('iconLips').classList.add('talking-animation');
        if (typeof sendMQTTCommand === "function") sendMQTTCommand(cmd);
    };

    window.triggerTTS = function () {
        // 🔒 CHẶN HOẠT HỌA NẾU MẤT KẾT NỐI
        if (!checkMqttConnection()) {
            alert("⚠️ Lỗi: Chưa kết nối MQTT Server! Không thể thực hiện chuyển đổi văn bản.");
            return;
        }

        const txtEl = document.getElementById('txtTtsInput');
        if (!txtEl || !txtEl.value.trim()) { alert("Hãy nhập chữ!"); return; }
        const cmd = `TextToSpeak("${txtEl.value.trim()}", "${document.getElementById('selLang').value}", "${document.getElementById('selVoice').value}", "${document.getElementById('selService').value}")`;
        document.getElementById('lblAudioCommandLog').innerHTML = `Lệnh: <span class="text-primary">${cmd}</span>`;
        window.stopAllAudioAnimations();
        document.getElementById('iconBook').classList.add('reading-animation');
        if (typeof sendMQTTCommand === "function") sendMQTTCommand(cmd);
    };

    window.triggerSilentAudio = function () {
        // 🔒 CHẶN HOẠT HỌA NẾU MẤT KẾT NỐI
        if (!checkMqttConnection()) {
            alert("⚠️ Lỗi: Chưa kết nối MQTT Server!");
            return;
        }

        const cmd = "Silent()";
        document.getElementById('lblAudioCommandLog').innerHTML = `Lệnh: <span class="text-danger">${cmd}</span>`;
        window.stopAllAudioAnimations();
        if (typeof sendMQTTCommand === "function") sendMQTTCommand(cmd);
    };

    window.stopAllAudioAnimations = function () {
        const i1 = document.getElementById('iconLips');
        const i2 = document.getElementById('iconBook');
        if (i1) i1.classList.remove('talking-animation');
        if (i2) i2.classList.remove('reading-animation');
    };

    window.updateVoiceDropdown();
</script>
